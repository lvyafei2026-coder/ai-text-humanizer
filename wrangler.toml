name = "ai-text-humanizer"
main = "src/index.js"
compatibility_date = "2026-09-27"

[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Rate Limiting：每 60 秒最多 30 次请求
[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
